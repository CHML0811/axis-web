<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AXIS</title>
<style>
  :root { --ink:#1c1a17; --paper:#f4f1ea; --soft:#6b655c; --shu:#bc3b2e; --line:#d8d2c6; }
  @media (prefers-color-scheme: dark) { :root { --ink:#ece7dd; --paper:#141210; --soft:#948d81; --line:#2b2823; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink);
    font:16px/1.65 ui-serif,Georgia,"Times New Roman",serif;
    min-height:100vh; display:grid; place-items:center; }
  main { max-width:520px; padding:48px 24px; }
  h1 { font-size:28px; letter-spacing:.24em; font-weight:600; margin:0 0 6px; }
  h1 span { color:var(--shu); }
  p { color:var(--soft); font-size:15px; margin:0 0 28px; }
  nav { display:flex; gap:20px; border-top:1px solid var(--line); padding-top:20px; }
  a { color:var(--shu); text-decoration:none; font-size:14px; }
  a:hover { text-decoration:underline; }
  a:focus-visible { outline:2px solid var(--shu); outline-offset:3px; }
</style>
</head>
<body>
<main>
  <h1>A<span>X</span>IS</h1>
  <p>Discipline is environment, not willpower.</p>
  <nav>
    <a href="./privacy.html">Privacy Policy</a>
    <a href="./support.html">Support</a>
  </nav>
</main>
</body>
</html>
